<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunker | R.I.P.</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Space+Mono:wght@700&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #020005;
            --glow-center: #1a0833;
            --neon-purple: #815cff;
            --stone-dark: #0a0612;
            --stone-light: #241738;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            background: radial-gradient(circle at 50% 55%, var(--glow-center) 0%, var(--bg-dark) 75%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: white;
        }

        /* Particle Canvas */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        .memorial-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        /* The Premium SVG Tombstone */
        .tombstone-wrapper {
            width: 100%;
            max-width: 360px;
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.95));
            opacity: 0;
            transform: translateY(60px) scale(0.9);
            /* Initial rise up, followed by infinite ethereal floating */
            animation: 
                riseUp 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s,
                floatEthereal 6s ease-in-out infinite 2s;
            position: relative;
        }

        /* Ambient Pulsing Aura behind the stone */
        .tombstone-wrapper::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 10%;
            width: 80%;
            height: 70%;
            background: var(--neon-purple);
            filter: blur(80px);
            opacity: 0;
            z-index: -1;
            animation: pulseGlow 4s infinite alternate ease-in-out 1s;
        }

        .tombstone-svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* SVG Typography & Details */
        .svg-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 44px;
            fill: #ffffff;
            letter-spacing: -1px;
            text-anchor: middle;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)) drop-shadow(0 0 30px rgba(255, 255, 255, 0.4));
        }

        .svg-rip {
            font-family: 'Cinzel', serif;
            font-weight: 800;
            font-size: 72px;
            fill: transparent;
            stroke: var(--neon-purple);
            stroke-width: 2.5px;
            text-anchor: middle;
            filter: drop-shadow(0 0 18px rgba(129, 92, 255, 0.9));
        }

        .svg-icon {
            font-size: 46px;
            text-anchor: middle;
            filter: drop-shadow(0 0 12px rgba(129, 92, 255, 0.5));
        }

        .svg-date {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 16px;
            fill: #c2b5db;
            letter-spacing: 2px;
            text-anchor: middle;
            filter: drop-shadow(0 0 5px rgba(129, 92, 255, 0.3));
        }

        /* Animations */
        @keyframes riseUp {
            0% { opacity: 0; transform: translateY(60px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        @keyframes floatEthereal {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.01); }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.15; filter: blur(70px); }
            100% { opacity: 0.4; filter: blur(90px); }
        }

        /* Mobile Adjustments */
        @media (max-width: 400px) {
            .tombstone-wrapper { max-width: 300px; }
            .svg-title { font-size: 36px; }
            .svg-rip { font-size: 60px; }
            .svg-date { font-size: 14px; }
            .svg-icon { font-size: 40px; }
        }
    </style>
</head>
<body>

    <!-- Ambient Particle Engine Canvas -->
    <canvas id="particles"></canvas>

    <div class="memorial-container">
        
        <!-- Premium SVG Tombstone -->
        <div class="tombstone-wrapper">
            <svg class="tombstone-svg" viewBox="0 0 420 580" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Dark Obsidian Gradient for Main Stone -->
                    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#2a1b40" />
                        <stop offset="40%" stop-color="#110a1f" />
                        <stop offset="100%" stop-color="#040208" />
                    </linearGradient>
                    
                    <!-- Gradient for Base Tiers -->
                    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#181026" />
                        <stop offset="100%" stop-color="#050308" />
                    </linearGradient>

                    <!-- Neon Edge Highlight for the Stone -->
                    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="rgba(129, 92, 255, 0.7)" />
                        <stop offset="50%" stop-color="rgba(255, 255, 255, 0.15)" />
                        <stop offset="100%" stop-color="rgba(129, 92, 255, 0.3)" />
                    </linearGradient>

                    <!-- Glow Filter for R.I.P Text -->
                    <filter id="neonTextGlow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- Ground Shadow Base -->
                <ellipse cx="210" cy="550" rx="190" ry="25" fill="#000" filter="blur(12px)" />
                <ellipse cx="210" cy="550" rx="140" ry="10" fill="rgba(129, 92, 255, 0.15)" filter="blur(15px)" />

                <!-- Base Tier 1 (Bottom, Widest) -->
                <rect x="30" y="520" width="360" height="30" rx="6" fill="url(#baseGrad)" stroke="rgba(129, 92, 255, 0.2)" stroke-width="1.5"/>
                
                <!-- Base Tier 2 (Middle) -->
                <rect x="50" y="490" width="320" height="30" rx="5" fill="url(#baseGrad)" stroke="rgba(129, 92, 255, 0.3)" stroke-width="1.5"/>
                
                <!-- Base Tier 3 (Top, Narrowest) -->
                <rect x="70" y="470" width="280" height="20" rx="4" fill="url(#baseGrad)" stroke="rgba(129, 92, 255, 0.4)" stroke-width="1.5"/>

                <!-- Main Stone Body -->
                <path d="M 90,470 L 90,190 C 90,60 330,60 330,190 L 330,470 Z" fill="url(#stoneGrad)" stroke="url(#edgeGrad)" stroke-width="3"/>
                
                <!-- Decorative Inner Glowing Border (Double Line) -->
                <path d="M 105,470 L 105,190 C 105,80 315,80 315,190 L 315,470" fill="none" stroke="rgba(129, 92, 255, 0.4)" stroke-width="1.5" stroke-dasharray="8 8"/>
                <path d="M 112,470 L 112,190 C 112,92 308,92 308,190 L 308,470" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
                
                <!-- Engraved Divider Lines -->
                <line x1="120" y1="195" x2="300" y2="195" stroke="rgba(0,0,0,0.8)" stroke-width="3" />
                <line x1="120" y1="196" x2="300" y2="196" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
                
                <line x1="130" y1="420" x2="290" y2="420" stroke="rgba(0,0,0,0.8)" stroke-width="3" />
                <line x1="130" y1="421" x2="290" y2="421" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

                <!-- Text Content -->
                <text x="210" y="165" class="svg-title">Bunker.</text>
                
                <text x="210" y="285" class="svg-rip" filter="url(#neonTextGlow)">R.I.P</text>
                
                <text x="210" y="365" class="svg-icon">💀</text>
                
                <text x="210" y="395" class="svg-date">01-11-25 &mdash; 24-02-26</text>
            </svg>
        </div>
    </div>

    <script>
        // --- Ambient Magical Embers Engine ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Spark {
            constructor() { this.reset(true); }
            
            reset(randomY = false) {
                this.x = Math.random() * width;
                // Spread embers evenly or start from the bottom
                this.y = randomY ? Math.random() * height : height + 20;
                this.size = Math.random() * 2.5 + 0.5;
                // Slower, more majestic rise
                this.speedY = -(Math.random() * 1 + 0.3); 
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.life = Math.random() * 0.8 + 0.2;
                
                // Color palette: Deep Purple, Bright Neon Purple, Soft Starlight White
                const colors = ['129, 92, 255', '180, 140, 255', '240, 235, 255'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            
            update() {
                this.y += this.speedY;
                // Gentle sway
                this.x += this.speedX + Math.sin(this.y * 0.005) * 0.5;
                
                // Smooth fade based on height
                let opacity = (this.y / height) * this.life;
                if (opacity < 0) opacity = 0;
                this.currentFill = `rgba(${this.color}, ${opacity})`;

                // Recycle particle when it floats off the top
                if (this.y < -30) this.reset();
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.currentFill;
                ctx.shadowBlur = 12;
                ctx.shadowColor = `rgba(${this.color}, ${this.life})`;
                ctx.fill();
                ctx.shadowBlur = 0; // reset for next drawing
            }
        }

        function initParticles() {
            particles = [];
            // Increased count slightly to fill the space beautifully
            for (let i = 0; i < 60; i++) particles.push(new Spark());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        initParticles();
        animate();
    </script>
</body>
</html>
