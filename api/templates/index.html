    <!-- Secret Feature Script - MUST LOAD LAST (now guaranteed to work) -->
    <script>
        (function() {
            let ripClickCount = 0;
            let isUnlocked = false;
            
            function initSecretFeature() {
                const ripText = document.getElementById('rip-text');   // ← Now exists because of the id we added
                const ripPage = document.getElementById('rip-page');
                const bunkerApp = document.getElementById('bunker-app');

                if (!ripText || !ripPage || !bunkerApp) {
                    console.log('RIP elements not ready yet, retrying...');
                    setTimeout(initSecretFeature, 100);
                    return;
                }

                console.log('✅ Secret RIP unlock feature initialized successfully');

                ripText.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    if (isUnlocked) return;
                    
                    ripClickCount++;
                    console.log(`RIP clicked ${ripClickCount} time(s)`);
                    
                    // Visual feedback on every click
                    ripText.style.filter = 'drop-shadow(0 0 30px rgba(129, 92, 255, 1.4))';
                    setTimeout(() => {
                        if (!isUnlocked) ripText.style.filter = '';
                    }, 180);

                    if (ripClickCount >= 7) {
                        console.log('🔓 Unlocking Bunker app...');
                        isUnlocked = true;
                        
                        ripPage.classList.add('hidden');
                        
                        setTimeout(() => {
                            bunkerApp.style.display = 'block';
                            bunkerApp.classList.add('visible');
                            
                            // Optional: show a small toast
                            if (typeof window.showToast === 'function') {
                                window.showToast('Bunker unlocked! Welcome back.', 'success');
                            }
                        }, 400);
                    }
                });

                // Auto-reset counter after 3s of inactivity
                let resetTimer;
                ripText.addEventListener('click', () => {
                    clearTimeout(resetTimer);
                    resetTimer = setTimeout(() => {
                        if (!isUnlocked) {
                            ripClickCount = 0;
                            console.log('RIP click counter reset');
                        }
                    }, 3000);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initSecretFeature);
            } else {
                initSecretFeature();
            }
        })();
    </script>

    <!-- Particle animation script - UNCHANGED -->
    <script>
        (function() {
            const canvas = document.getElementById('particles');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            
            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            class Spark {
                constructor() { this.reset(true); }
                reset(randomY = false) {
                    this.x = Math.random() * width;
                    this.y = randomY ? Math.random() * height : height + 20;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.speedY = -(Math.random() * 1 + 0.3);
                    this.speedX = (Math.random() - 0.5) * 0.6;
                    this.life = Math.random() * 0.8 + 0.2;
                    const colors = ['129, 92, 255', '180, 140, 255', '240, 235, 255'];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }
                update() {
                    this.y += this.speedY;
                    this.x += this.speedX + Math.sin(this.y * 0.005) * 0.5;
                    let opacity = (this.y / height) * this.life;
                    if (opacity < 0) opacity = 0;
                    this.currentFill = `rgba(${this.color}, ${opacity})`;
                    if (this.y < -30) this.reset();
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.currentFill;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = `rgba(${this.color}, ${this.life})`;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < 60; i++) particles.push(new Spark());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resize);
            resize();
            initParticles();
            animate();
        })();
    </script>
